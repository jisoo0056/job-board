<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채용 모아보기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1>채용 모아보기</h1>
      <span class="updated" id="updated">불러오는 중…</span>
    </div>
    <nav class="views" role="tablist">
      <button class="view on" data-view="jobs">공고</button>
      <button class="view" data-view="companies">기관 목록</button>
      <button class="icon-btn" id="openSettings" title="관리 설정" aria-label="관리 설정">⚙</button>
    </nav>
  </div>
</header>

<div id="alerts"></div>

<main id="view-jobs" class="layout">
  <aside class="filters">
    <div class="fgroup">
      <label class="flabel" for="q">검색</label>
      <input id="q" type="search" placeholder="기관명, 공고 제목">
    </div>
    <div class="fgroup">
      <span class="flabel">분야</span>
      <div class="chips" id="fieldChips"></div>
    </div>
    <div class="fgroup">
      <span class="flabel">직무</span>
      <div class="chips" id="tagChips"></div>
    </div>
    <div class="fgroup">
      <span class="flabel">기관 분류</span>
      <div class="chips" id="groupChips"></div>
    </div>
    <div class="fgroup">
      <label class="check"><input type="checkbox" id="newOnly"> NEW만 보기</label>
      <label class="check"><input type="checkbox" id="hideRead"> 읽은 공고 숨기기</label>
    </div>
    <div class="fgroup">
      <span class="flabel">경력 조건</span>
      <label class="check"><input type="checkbox" id="hideExp"> 경력만 뽑는 공고 숨기기</label>
      <label class="check"><input type="checkbox" id="newcomerOnly"> '신입' 명시된 공고만</label>
    </div>
    <button class="link-btn" id="resetFilters">필터 초기화</button>
  </aside>

  <section class="content">
    <div class="tabs" id="typeTabs" role="tablist"></div>
    <div id="openList" class="list"></div>
    <details class="closed-box" id="closedBox">
      <summary>마감된 공고 <span id="closedCount"></span></summary>
      <div id="closedList" class="list closed"></div>
    </details>
  </section>
</main>

<main id="view-companies" class="single" hidden>
  <div class="comp-head">
    <p class="muted">✓ 자동 수집 · ⚠ 수집 실패(사이트 확인 필요) · 🔗 자동 수집이 안 되는 곳(직접 확인) · <b class="rec">추천</b> 추천 기관</p>
    <button class="btn" id="addCompanyBtn">+ 기관 추가</button>
  </div>
  <div id="companyList"></div>
</main>

<!-- 관리 설정 -->
<dialog id="settings">
  <form method="dialog" class="dlg">
    <h2>관리 설정</h2>
    <p class="muted">공고 분류 수정, 기관 추가는 GitHub에 저장돼요. 아래에 GitHub 토큰을 한 번 넣으면 이 기기(브라우저)에서 계속 쓸 수 있어요. 방법은 README에 있어요.</p>
    <label>저장소 (아이디/저장소이름)<input id="repoInput" placeholder="myid/job-board"></label>
    <label>GitHub 토큰<input id="tokenInput" type="password" placeholder="github_pat_…"></label>
    <div class="dlg-actions">
      <button value="cancel" class="btn ghost">닫기</button>
      <button id="runNow" type="button" class="btn ghost">지금 수집 실행</button>
      <button id="saveSettings" value="ok" class="btn">저장</button>
    </div>
    <p class="muted small" id="settingsMsg"></p>
  </form>
</dialog>

<!-- 기관 추가 -->
<dialog id="addCompany">
  <form method="dialog" class="dlg" id="addCompanyForm">
    <h2>기관 추가</h2>
    <label>기관 이름<input name="name" required></label>
    <label>기관 분류
      <select name="group" id="groupSelect"></select>
    </label>
    <label>채용 게시판 주소 (URL)<input name="url" type="url" placeholder="https://…/recruit/list"></label>
    <label>수집 방식
      <select name="source">
        <option value="web">게시판에서 자동 수집</option>
        <option value="alio">공공기관 채용정보 API (공공기관일 때)</option>
        <option value="link">수집 안 함 · 링크만 저장</option>
      </select>
    </label>
    <label>메모<input name="note" placeholder="선택"></label>
    <p class="muted small">채용 '게시판 목록' 주소를 넣으면 가장 잘 잡혀요. 다음 날 아침 수집부터 반영돼요.</p>
    <div class="dlg-actions">
      <button value="cancel" class="btn ghost" formnovalidate>취소</button>
      <button value="ok" class="btn">추가</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
