name: 채용공고 수집

on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 늦어질 때가 있어서 두 번 걸어둠 (한국시간 새벽 5:17, 아침 7:17)
    # 두 번째 실행은 이미 본 공고를 다시 알리지 않으므로 메일이 중복되지 않음
    - cron: "17 20 * * *"
    - cron: "17 22 * * *"
  workflow_dispatch:         # 사이트의 '지금 수집 실행' 버튼 / Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: 설치
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scraper/collect.py

      - name: 결과 저장
        run: |
          git config user.name "job-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json docs/data/status.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "채용공고 수집 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
